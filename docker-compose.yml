services:
  postgres:
    image: postgres:17-alpine
    container_name: shelf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SHELF_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${SHELF_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${SHELF_POSTGRES_DATABASE:-shelf}
    ports:
      # Bound to the loopback on purpose: this file is a development convenience, and a
      # database published on every interface with a default password is not one.
      - "127.0.0.1:${SHELF_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${SHELF_POSTGRES_USER:-postgres} -d ${SHELF_POSTGRES_DATABASE:-shelf}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    profiles: [ "app" ]
    build:
      context: .
    container_name: shelf-backend
    restart: unless-stopped
    # The schema is applied by the service itself on startup, from the migrations built into
    # the binary, so waiting for the database to be healthy is the whole of the ordering.
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SHELF_POSTGRES_HOST: postgres
      SHELF_POSTGRES_PORT: 5432
      SHELF_POSTGRES_USER: ${SHELF_POSTGRES_USER:-postgres}
      SHELF_POSTGRES_PASSWORD: ${SHELF_POSTGRES_PASSWORD:-postgres}
      SHELF_POSTGRES_DATABASE: ${SHELF_POSTGRES_DATABASE:-shelf}
      SHELF_APP_ENV: ${SHELF_APP_ENV:-local}
      SHELF_LOG_FORMAT: json
      # A value in .env is substituted into this file, not handed to the container, so a
      # secret that is not named here never reaches the process. Without it the service
      # either mints an ephemeral one and invalidates every token on restart, or refuses to
      # start at all outside app.env=local — and both look like the image being broken.
      SHELF_AUTH_SECRET: ${SHELF_AUTH_SECRET:-}
      # The Claude connector, off unless all three are set. Without them the routes are not
      # mounted at all, and the client is told so rather than discovering it as a 404 after
      # it has already made a vault.
      SHELF_MCP_ENABLED: ${SHELF_MCP_ENABLED:-false}
      SHELF_MCP_SECRET: ${SHELF_MCP_SECRET:-}
      SHELF_MCP_PUBLIC_BASE_URL: ${SHELF_MCP_PUBLIC_BASE_URL:-}
    ports:
      - "${SHELF_HTTP_PORT:-8080}:8080"

volumes:
  postgres-data:

        maxItems: 8192
        minItems: 16
        type: array
      meta_nonce:
        items:
          format: byte
          type: integer
        maxItems: 32
        minItems: 12
        type: array
      scope_client_id:
        description: ScopeClientID names the vault's own key scope, which the key
          below is sealed against.
        type: string
      wrap_algorithm:
        description: Algorithm names the sealed-box format, so a later format can
          be told apart.
        maxLength: 64
        type: string
      wrapped_key:
        description: WrappedKey is the vault content key sealed to the creator's own
          public key.
        items:
          format: byte
          type: integer
        maxItems: 1024
        minItems: 32
        type: array
    required:
    - client_id
    - key_nonce
    - meta
    - meta_nonce
    - scope_client_id
    - wrapped_key
    type: object

        description: |-
          TokenHash is the digest of a secret the server never sees, the same shape as a code
          invite. The secret travels in the link fragment and stays in the visitor's browser.
        items:
          format: byte
          type: integer
        maxItems: 64
        minItems: 32
        type: array

    type: object
  auth.registerRequest:
    properties:
      auth_hash:
        items:
          format: byte
          type: integer
        maxItems: 128
        minItems: 16
        type: array
      display_name:
        example: Dmitry Murygin
        maxLength: 128
        minLength: 1
        type: string
      kdf_params:
        $ref: '#/definitions/auth.kdfParams'
      kdf_salt:
        items:

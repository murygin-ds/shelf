      meta:
        items:
          format: byte
          type: integer
        maxItems: 8192
        minItems: 16
        type: array
      meta_nonce:
        items:
          format: byte
          type: integer
        maxItems: 32
        minItems: 12
        type: array
    required:
    - entity_id
    - entity_type
    - meta
    - meta_nonce
    type: object
  vault.setLabelRequest:
    properties:

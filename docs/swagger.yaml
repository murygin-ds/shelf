      private_key_nonce:
        items:
          format: byte
          type: integer
        maxItems: 32
        minItems: 12
        type: array
      public_key:
        items:
          format: byte
          type: integer
        maxItems: 1024
        minItems: 32
        type: array
      recovery:
        $ref: '#/definitions/auth.recoveryKey'
      wrapped_master_key:
        items:
          format: byte
          type: integer
        maxItems: 1024
        minItems: 32
        type: array
      wrapped_private_key:
        items:
          format: byte
          type: integer
        maxItems: 1024
        minItems: 32
        type: array
    required:
    - auth_hash
    - display_name
    - kdf_params
    - kdf_salt
    - login
    - master_key_nonce
    - private_key_nonce
    - public_key
    - recovery
    - wrapped_master_key
    - wrapped_private_key

        type: integer
      id:
        example: 88
        type: integer
      inherit_access:
        example: true
        type: boolean
      key_scope_client_id:
        type: string
      key_scope_id:
        example: 1
        type: integer
      key_version:
        example: 1
        type: integer
      meta:
        items:
          format: byte
          type: integer
        type: array
      meta_nonce:
        items:
          format: byte
          type: integer
        type: array
      own_scope:
        example: false
        type: boolean
      permission:
        example: edit
        type: string
      updated_at:
        type: string
      updated_by:
        type: integer
      updated_seq:
        example: 42
        type: integer
      vault_id:
        example: 1
        type: integer

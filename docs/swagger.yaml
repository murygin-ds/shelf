  vault.createShareRequest:
    properties:
      content:
        items:
          format: byte
          type: integer
        maxItems: 4194304
        minItems: 16
        type: array
      content_nonce:
        items:
          format: byte
          type: integer
        maxItems: 32
        minItems: 12
        type: array
      content_seq:
        minimum: 1
        type: integer
      expires_at:
        type: string
      meta:
        description: |-
          The note re-encrypted under a key derived from that secret. Not the scope key: a
          scope covers a whole folder or vault, and one published note must not be the key to
          everything sealed beside it.
        items:
          format: byte
          type: integer
        maxItems: 8192
        minItems: 16

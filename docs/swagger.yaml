        items:
          format: byte
          type: integer
        maxItems: 128
        minItems: 16
        type: array
    required:
    - login
    - recovery_auth_hash
    type: object
  auth.refreshRequest:
    properties:
      refresh_token:
        maxLength: 256
        minLength: 16
        type: string
    required:

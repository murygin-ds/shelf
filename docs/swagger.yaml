basePath: /
definitions:
  access.ChallengeResponse:
    properties:
      expires_at:
        type: string
      invite_id:
        example: 4
        type: integer
      key_grants:
        items:
          $ref: '#/definitions/access.SealedKeyResponse'
        type: array
      preview_nonce:
        items:
          format: byte
          type: integer
        type: array
      wrapped_preview:
        items:
          format: byte
          type: integer
        type: array
    type: object
  access.DirectoryResponse:
    properties:
      display_name:
        example: Marta Chen
        type: string
      fingerprint:
        example: A1B2 C3D4 E5F6 G7H8
        type: string
      login:
        example: marta@acme.dev
        type: string
      public_key:
        items:
          format: byte
          type: integer
        type: array
      user_id:
        example: 7
        type: integer
    type: object
  access.GrantResponse:
    properties:
      created_at:
        type: string
      id:
        example: 3
        type: integer
      permission:
        example: edit
        type: string
      scope_ref_id:
        example: 12
        type: integer
      scope_type:
        example: folder
        type: string
      subject_id:
        example: 7
        type: integer
      subject_label:
        example: Marta Chen
        type: string
      subject_type:
        example: user
        type: string
    type: object
  access.GrantsResponse:
    properties:
      grants:
        items:
          $ref: '#/definitions/access.GrantResponse'
        type: array
    type: object
  access.InviteResponse:
    properties:
      created_at:
        type: string
      email_hint:
        example: dana@acme.dev
        type: string
      expires_at:
        type: string
      id:
        example: 4
        type: integer
      inviter_name:
        example: Ilya Volkov
        type: string
      redeemed_at:
        type: string
      role:
        example: editor
        type: string
      vault_id:
        example: 1
        type: integer
    type: object
  access.InvitesResponse:
    properties:
      invites:
        items:
          $ref: '#/definitions/access.InviteResponse'
        type: array
    type: object
  access.MemberResponse:
    properties:
      created_at:
        type: string
      display_name:
        example: Marta Chen
        type: string
      fingerprint:
        example: A1B2 C3D4 E5F6 G7H8
        type: string
      folder_count:
        example: 3
        type: integer
      key_state:
        example: ok
        type: string
      last_active:
        type: string
      login:
        example: marta@acme.dev
        type: string
      public_key:
        items:
          format: byte
          type: integer
        type: array
      role:
        example: editor
        type: string
      user_id:
        example: 7
        type: integer
    type: object
  access.MembersResponse:
    properties:
      members:
        items:
          $ref: '#/definitions/access.MemberResponse'
        type: array
    type: object
  access.RemovalResponse:
    properties:
      pending_rotation:
        items:
          type: integer
        type: array
    type: object
  access.SealedKeyResponse:
    properties:
      key_version:
        example: 1
        type: integer
      nonce:
        items:
          format: byte
          type: integer
        type: array
      scope_client_id:
        type: string
      scope_id:
        example: 1
        type: integer
      wrap_algorithm:
        example: aesgcm-invite-v1
        type: string
      wrapped_key:
        items:
          format: byte
          type: integer
        type: array
    type: object
  access.createInviteRequest:
    properties:
      email_hint:
        maxLength: 128
        type: string
      expires_at:
        type: string
      key_grants:
        items:
          $ref: '#/definitions/access.sealedKeyRequest'
        maxItems: 64
        minItems: 1
        type: array
      preview_nonce:
        items:
          format: byte
          type: integer
        maxItems: 32
        minItems: 12
        type: array
      role:
        enum:
        - admin
        - editor
        - viewer
        type: string
      target_user_id:
        minimum: 1
        type: integer
      token_hash:
        description: |-
          TokenHash is the digest of a code the server never sees. Exactly one of this and
          TargetUserID is set.
        items:
          format: byte
          type: integer
        type: array
      wrapped_preview:
        description: |-
          Preview holds the vault name and the inviter, encrypted under the same code, so an
          unauthenticated lookup reveals nothing.
        items:
          format: byte
          type: integer
        maxItems: 2048
        minItems: 16
        type: array
    required:
    - key_grants
    - role
    type: object
  access.lookupInviteRequest:
    properties:
      token_hash:
        items:
          format: byte
          type: integer
        type: array
    required:
    - token_hash
    type: object
  access.putGrantRequest:
    properties:
      key_grants:
        description: |-
          Keys must cover the node's scope whenever the permission allows reading: without
          them the subject would see an entry it can never open.
        items:
          $ref: '#/definitions/access.sealedKeyRequest'
        maxItems: 64
        type: array
      permission:
        enum:
        - none
        - view
        - comment
        - edit
        - own
        type: string
      scope_ref_id:
        minimum: 1
        type: integer
      scope_type:
        enum:
        - folder
        - file
        type: string
      subject_id:
        minimum: 1
        type: integer
      subject_type:
        enum:
        - user
        - group
        type: string
    required:
    - permission
    - scope_ref_id
    - scope_type
    - subject_id
    - subject_type
    type: object
  access.redeemInviteRequest:
    properties:
      invite_id:
        minimum: 1
        type: integer
      key_grants:
        items:
          $ref: '#/definitions/access.sealedKeyRequest'
        maxItems: 64
        minItems: 1
        type: array
      token_hash:
        items:
          format: byte
          type: integer
        type: array
    required:
    - key_grants
    type: object
  access.sealedKeyRequest:
    properties:
      key_version:
        minimum: 1
        type: integer
      nonce:
        items:
          format: byte
          type: integer
        maxItems: 32
        minItems: 12
        type: array
      scope_id:
        minimum: 1
        type: integer
      wrap_algorithm:
        description: |-
          Algorithm names the wrapping format. Invite keys use a code-derived symmetric key
          rather than a sealed box, because nobody knows yet whose key to seal to.
        maxLength: 64
        type: string
      wrapped_key:
        items:
          format: byte
          type: integer
        maxItems: 2048
        minItems: 32
        type: array
    required:
    - key_version
    - nonce
    - scope_id
    - wrapped_key
    type: object
  access.setRoleRequest:
    properties:
      role:
        enum:
        - admin
        - editor
        - viewer
        type: string
    required:
    - role
    type: object
  api.HealthResponse:
    properties:
      service:
        example: shelf-backend
        type: string
      status:
        example: ok
        type: string
    type: object
  auth.DeviceResponse:
    properties:
      created_at:
        type: string
      current:
        example: true
        type: boolean
      expires_at:
        type: string
      id:
        example: 12
        type: integer
      ip:
        example: 203.0.113.7
        type: string
      last_used_at:
        type: string
      user_agent:
        type: string
    type: object
  auth.DevicesResponse:
    properties:
      sessions:
        items:
          $ref: '#/definitions/auth.DeviceResponse'
        type: array
    type: object
  auth.KDFParams:
    properties:
      algorithm:
        type: string
      iterations:
        type: integer
      memory:
        type: integer
      parallelism:
        type: integer
    type: object
  auth.KeysResponse:
    properties:
      kdf_params:
        $ref: '#/definitions/auth.KDFParams'
      kdf_salt:
        items:
          format: byte
          type: integer
        type: array
      master_key_nonce:
        items:
          format: byte
          type: integer
        type: array
      private_key_nonce:
        items:
          format: byte
          type: integer
        type: array
      public_key:
        items:
          format: byte
          type: integer
        type: array
      wrapped_master_key:
        items:
          format: byte
          type: integer
        type: array
      wrapped_private_key:
        items:
          format: byte
          type: integer
        type: array
    type: object
  auth.PreloginResponse:
    properties:
      kdf_params:
        $ref: '#/definitions/auth.KDFParams'
      kdf_salt:
        items:
          format: byte
          type: integer
        type: array
    type: object
  auth.RecoveryChallengeResponse:
    properties:
      expires_at:
        type: string
      nonce:
        items:
          format: byte
          type: integer
        type: array
      recovery_token:
        type: string
      wrapped_master_key:
        items:
          format: byte
          type: integer
        type: array
    type: object
  auth.SessionResponse:
    properties:
      keys:
        $ref: '#/definitions/auth.KeysResponse'
      tokens:
        $ref: '#/definitions/auth.TokensResponse'
      user:
        $ref: '#/definitions/auth.UserResponse'
    type: object
  auth.TokensResponse:
    properties:
      access_expires_at:
        type: string
      access_token:
        type: string
      refresh_expires_at:
        type: string
      refresh_token:
        type: string
      token_type:
        example: Bearer
        type: string
    type: object
  auth.UserResponse:
    properties:
      created_at:
        type: string
      display_name:
        example: Dmitry Murygin
        type: string
      id:
        example: 1
        type: integer
      login:
        example: dmitry
        type: string
    type: object
  auth.changePasswordRequest:
    properties:
      auth_hash:
        items:
          format: byte
          type: integer
        maxItems: 128
        minItems: 16
        type: array
      current_auth_hash:
        items:
          format: byte
          type: integer
        maxItems: 128
        minItems: 16
        type: array
      kdf_params:
        $ref: '#/definitions/auth.kdfParams'
      kdf_salt:
        items:
          format: byte
          type: integer
        maxItems: 64
        minItems: 16
        type: array
      master_key_nonce:
        items:
          format: byte
          type: integer
        maxItems: 32
        minItems: 12
        type: array
      recovery:
        $ref: '#/definitions/auth.recoveryKey'
      wrapped_master_key:
        items:
          format: byte
          type: integer
        maxItems: 1024
        minItems: 32
        type: array
    required:
    - auth_hash
    - current_auth_hash
    - kdf_params
    - kdf_salt
    - master_key_nonce
    - wrapped_master_key
    type: object
  auth.kdfParams:
    properties:
      algorithm:
        enum:
        - argon2id
        example: argon2id
        type: string
      iterations:
        example: 3
        maximum: 16
        minimum: 2
        type: integer
      memory:
        example: 65536
        minimum: 19456
        type: integer
      parallelism:
        example: 2
        maximum: 16
        minimum: 1
        type: integer
    required:
    - algorithm
    - iterations
    - memory
    - parallelism
    type: object
  auth.loginRequest:
    properties:
      auth_hash:
        items:
          format: byte
          type: integer
        maxItems: 128
        minItems: 16
        type: array
      login:
        example: dmitry
        maxLength: 64
        minLength: 3
        type: string
    required:
    - auth_hash
    - login
    type: object
  auth.preloginRequest:
    properties:
      login:
        example: dmitry
        maxLength: 64
        minLength: 3
        type: string
    required:
    - login
    type: object
  auth.recoveryCompleteRequest:
    properties:
      auth_hash:
        items:
          format: byte
          type: integer
        maxItems: 128
        minItems: 16
        type: array
      kdf_params:
        $ref: '#/definitions/auth.kdfParams'
      kdf_salt:
        items:
          format: byte
          type: integer
        maxItems: 64
        minItems: 16
        type: array
      master_key_nonce:
        items:
          format: byte
          type: integer
        maxItems: 32
        minItems: 12
        type: array
      recovery:
        $ref: '#/definitions/auth.recoveryKey'
      recovery_token:
        type: string
      wrapped_master_key:
        items:
          format: byte
          type: integer
        maxItems: 1024
        minItems: 32
        type: array
    required:
    - auth_hash
    - kdf_params
    - kdf_salt
    - master_key_nonce
    - recovery_token
    - wrapped_master_key
    type: object
  auth.recoveryKey:
    properties:

        maxItems: 32
        minItems: 12
        type: array
      wrapped_master_key:
        items:
          format: byte
          type: integer
        maxItems: 1024
        minItems: 32
        type: array
    required:
    - auth_hash
    - nonce
    - wrapped_master_key
    type: object
  auth.recoveryStartRequest:
    properties:
      login:
        example: dmitry
        maxLength: 64
        minLength: 3
        type: string
      recovery_auth_hash:
        description: AuthHash is derived by the client from the recovery code and

basePath: /
definitions:
  api.HealthResponse:
    properties:
      service:
        example: shelf-backend
        type: string
      status:
        example: ok
        type: string
    type: object
  auth.DeviceResponse:
    properties:
      created_at:
        type: string
      current:
        example: true
        type: boolean
      expires_at:
        type: string
      id:
        example: 12
        type: integer
      ip:
        example: 203.0.113.7
        type: string
      last_used_at:
        type: string
      user_agent:
        type: string
    type: object
  auth.DevicesResponse:
    properties:
      sessions:
        items:
          $ref: '#/definitions/auth.DeviceResponse'
        type: array
    type: object
  auth.KDFParams:
    properties:
      algorithm:
        type: string
      iterations:
        type: integer
      memory:
        type: integer
      parallelism:
        type: integer
    type: object
  auth.KeysResponse:
    properties:
      kdf_params:
        $ref: '#/definitions/auth.KDFParams'
      kdf_salt:
        items:
          format: byte
          type: integer
        type: array
      master_key_nonce:
        items:
          format: byte
          type: integer
        type: array
      private_key_nonce:
        items:
          format: byte
          type: integer
        type: array
      public_key:
        items:
          format: byte
          type: integer
        type: array
      wrapped_master_key:
        items:
          format: byte
          type: integer
        type: array
      wrapped_private_key:
        items:
          format: byte
          type: integer
        type: array
    type: object
  auth.PreloginResponse:
    properties:
      kdf_params:
        $ref: '#/definitions/auth.KDFParams'
      kdf_salt:
        items:
          format: byte
          type: integer
        type: array
    type: object
  auth.RecoveryChallengeResponse:
    properties:
      expires_at:
        type: string
      nonce:
        items:
          format: byte
          type: integer
        type: array
      recovery_token:
        type: string
      wrapped_master_key:
        items:
          format: byte
          type: integer
        type: array
    type: object
  auth.SessionResponse:
    properties:
      keys:
        $ref: '#/definitions/auth.KeysResponse'
      tokens:
        $ref: '#/definitions/auth.TokensResponse'
      user:
        $ref: '#/definitions/auth.UserResponse'
    type: object
  auth.TokensResponse:
    properties:
      access_expires_at:
        type: string
      access_token:
        type: string
      refresh_expires_at:
        type: string
      refresh_token:
        type: string
      token_type:
        example: Bearer
        type: string
    type: object
  auth.UserResponse:
    properties:
      created_at:
        type: string
      display_name:
        example: Dmitry Murygin
        type: string
      id:
        example: 1
        type: integer
      login:
        example: dmitry
        type: string
    type: object
  auth.changePasswordRequest:
    properties:
      auth_hash:
        items:
          format: byte
          type: integer
        maxItems: 128
        minItems: 16
        type: array
      current_auth_hash:
        items:
          format: byte
          type: integer
        maxItems: 128
        minItems: 16
        type: array
      kdf_params:
        $ref: '#/definitions/auth.kdfParams'
      kdf_salt:
        items:
          format: byte
          type: integer
        maxItems: 64
        minItems: 16
        type: array
      master_key_nonce:
        items:
          format: byte
          type: integer
        maxItems: 32
        minItems: 12
        type: array
      recovery:
        $ref: '#/definitions/auth.recoveryKey'
      wrapped_master_key:
        items:
          format: byte
          type: integer
        maxItems: 1024
        minItems: 32
        type: array
    required:
    - auth_hash
    - current_auth_hash
    - kdf_params
    - kdf_salt
    - master_key_nonce
    - wrapped_master_key
    type: object
  auth.kdfParams:
    properties:
      algorithm:
        enum:
        - argon2id
        example: argon2id
        type: string
      iterations:
        example: 3
        maximum: 16
        minimum: 2
        type: integer
      memory:
        example: 65536
        minimum: 19456
        type: integer
      parallelism:
        example: 2
        maximum: 16
        minimum: 1
        type: integer
    required:
    - algorithm
    - iterations
    - memory
    - parallelism
    type: object
  auth.loginRequest:
    properties:
      auth_hash:
        items:
          format: byte
          type: integer
        maxItems: 128
        minItems: 16
        type: array
      login:
        example: dmitry
        maxLength: 64
        minLength: 3
        type: string
    required:
    - auth_hash
    - login
    type: object
  auth.preloginRequest:
    properties:
      login:
        example: dmitry
        maxLength: 64
        minLength: 3
        type: string
    required:
    - login
    type: object
  auth.recoveryCompleteRequest:
    properties:
      auth_hash:
        items:
          format: byte
          type: integer
        maxItems: 128
        minItems: 16
        type: array
      kdf_params:
        $ref: '#/definitions/auth.kdfParams'
      kdf_salt:
        items:
          format: byte
          type: integer
        maxItems: 64
        minItems: 16
        type: array
      master_key_nonce:
        items:
          format: byte
          type: integer
        maxItems: 32
        minItems: 12
        type: array
      recovery:
        $ref: '#/definitions/auth.recoveryKey'
      recovery_token:
        type: string
      wrapped_master_key:
        items:
          format: byte
          type: integer
        maxItems: 1024
        minItems: 32
        type: array
    required:
    - auth_hash
    - kdf_params
    - kdf_salt
    - master_key_nonce
    - recovery_token
    - wrapped_master_key
    type: object
  auth.recoveryKey:
    properties:
      auth_hash:
        items:
          format: byte
          type: integer
        maxItems: 128
        minItems: 16
        type: array
      nonce:
        items:
          format: byte
          type: integer
        maxItems: 32
        minItems: 12
        type: array
      wrapped_master_key:
        items:
          format: byte
          type: integer
        maxItems: 1024
        minItems: 32
        type: array
    required:
    - auth_hash
    - nonce
    - wrapped_master_key
    type: object
  auth.recoveryStartRequest:
    properties:
      login:
        example: dmitry
        maxLength: 64
        minLength: 3
        type: string
      recovery_auth_hash:
        description: AuthHash is derived by the client from the recovery code and
          serves as the verifier.
        items:
          format: byte
          type: integer
        maxItems: 128
        minItems: 16
        type: array
    required:
    - login
    - recovery_auth_hash
    type: object
  auth.refreshRequest:
    properties:
      refresh_token:
        maxLength: 256
        minLength: 16
        type: string
    required:
    - refresh_token
    type: object
  auth.registerRequest:
    properties:
      auth_hash:
        items:
          format: byte
          type: integer
        maxItems: 128
        minItems: 16
        type: array
      display_name:
        example: Dmitry Murygin
        maxLength: 128
        minLength: 1
        type: string
      kdf_params:
        $ref: '#/definitions/auth.kdfParams'
      kdf_salt:
        items:
          format: byte
          type: integer
        maxItems: 64
        minItems: 16
        type: array
      login:
        example: dmitry
        maxLength: 64
        minLength: 3
        type: string
      master_key_nonce:
        items:
          format: byte
          type: integer
        maxItems: 32
        minItems: 12
        type: array
      private_key_nonce:
        items:
          format: byte
          type: integer
        maxItems: 32
        minItems: 12
        type: array
      public_key:
        items:
          format: byte
          type: integer
        maxItems: 1024
        minItems: 32
        type: array
      recovery:
        $ref: '#/definitions/auth.recoveryKey'
      wrapped_master_key:
        items:
          format: byte
          type: integer
        maxItems: 1024
        minItems: 32
        type: array
      wrapped_private_key:
        items:
          format: byte
          type: integer
        maxItems: 1024
        minItems: 32
        type: array
    required:
    - auth_hash
    - display_name
    - kdf_params
    - kdf_salt
    - login
    - master_key_nonce
    - private_key_nonce
    - public_key
    - recovery
    - wrapped_master_key
    - wrapped_private_key
    type: object
  response.Error:
    properties:
      code:
        example: not_found
        type: string
      details:
        additionalProperties:
          type: string
        type: object
      message:
        example: resource not found
        type: string
      request_id:
        example: 1f8c1a5e-2b3d-4d6a-9c0e-5f5a5a7d1234
        type: string
    type: object
  response.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/response.Error'
    type: object
  vault.ContentResponse:
    properties:
      content_seq:
        example: 15
        type: integer
      updated_at:
        type: string
      updated_seq:
        example: 43
        type: integer
    type: object
  vault.FileResponse:
    properties:
      client_id:
        type: string
      content:
        items:
          format: byte
          type: integer
        type: array
      content_nonce:
        items:
          format: byte
          type: integer
        type: array
      content_seq:
        example: 14
        type: integer
      content_size:
        example: 8192
        type: integer
      created_at:
        type: string
      deleted_at:
        type: string
      folder_id:
        type: integer
      grant_count:
        example: 1
        type: integer
      id:
        example: 88
        type: integer
      inherit_access:
        example: true
        type: boolean
      key_scope_id:
        example: 1
        type: integer
      key_version:
        example: 1
        type: integer
      meta:
        items:
          format: byte
          type: integer
        type: array
      meta_nonce:
        items:
          format: byte
          type: integer
        type: array
      own_scope:
        example: false
        type: boolean
      permission:
        example: edit
        type: string
      updated_at:
        type: string
      updated_by:
        type: integer
      updated_seq:
        example: 42
        type: integer
      vault_id:
        example: 1
        type: integer
    type: object
  vault.FilesResponse:
    properties:
      files:
        items:
          $ref: '#/definitions/vault.FileResponse'
        type: array
    type: object
  vault.FolderResponse:
    properties:
      client_id:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      depth:
        example: 0
        type: integer
      grant_count:
        example: 1
        type: integer
      id:
        example: 12
        type: integer
      inherit_access:
        example: true
        type: boolean
      key_scope_id:
        example: 1
        type: integer
      key_version:
        example: 1
        type: integer
      meta:
        items:
          format: byte
          type: integer
        type: array
      meta_nonce:
        items:
          format: byte
          type: integer
        type: array
      own_scope:
        example: false
        type: boolean
      parent_id:
        type: integer
      permission:
        example: own
        type: string
      position:
        example: 0
        type: integer
      updated_at:
        type: string
      updated_by:
        type: integer
      updated_seq:
        example: 41
        type: integer
      vault_id:
        example: 1
        type: integer
    type: object
  vault.KeyGrantResponse:
    properties:
      key_version:
        example: 1
        type: integer
      nonce:
        items:
          format: byte
          type: integer
        type: array
      scope_client_id:
        type: string
      scope_id:
        example: 1
        type: integer
      subject_id:
        example: 1
        type: integer
      subject_type:
        example: user
        type: string
      wrap_algorithm:
        example: ecdh-p256-hkdf-a256gcm
        type: string
      wrapped_key:
        items:
          format: byte
          type: integer
        type: array
    type: object
  vault.KeyGrantsResponse:
    properties:
      grants:
        items:
          $ref: '#/definitions/vault.KeyGrantResponse'
        type: array
    type: object
  vault.PurgedResponse:
    properties:
      files:
        items:
          type: integer
        type: array
      folders:
        items:
          type: integer
        type: array
    type: object
  vault.ScopeResponse:
    properties:
      client_id:
        type: string
      grant_count:
        example: 6
        type: integer
      id:
        example: 1
        type: integer
      key_version:
        example: 4
        type: integer
      ref_id:
        example: 1
        type: integer
      rotated_at:
        type: string
      scope_type:
        example: vault
        type: string
    type: object
  vault.ScopesResponse:
    properties:
      scopes:
        items:
          $ref: '#/definitions/vault.ScopeResponse'
        type: array
    type: object
  vault.SyncResponse:
    properties:
      cursor:
        example: 4821
        type: integer
      files:
        items:
          $ref: '#/definitions/vault.FileResponse'
        type: array
      folders:
        items:
          $ref: '#/definitions/vault.FolderResponse'
        type: array
      full_resync_required:
        description: |-
          FullResync tells the client to drop its cached copy of this vault. It is the only
          way it learns to forget plaintext it cached before losing access to it.
        example: false
        type: boolean
      has_more:
        example: false
        type: boolean
      purged:
        $ref: '#/definitions/vault.PurgedResponse'
    type: object
  vault.TreeResponse:
    properties:
      files:
        items:
          $ref: '#/definitions/vault.FileResponse'
        type: array
      folders:
        items:
          $ref: '#/definitions/vault.FolderResponse'
        type: array
    type: object
  vault.VaultResponse:
    properties:
      change_seq:
        example: 42
        type: integer
      client_id:
        type: string
      created_at:
        type: string
      id:
        example: 1
        type: integer
      meta:
        items:
          format: byte
          type: integer
        type: array
      meta_nonce:
        items:
          format: byte
          type: integer
        type: array
      owner_id:
        example: 1
        type: integer
      updated_at:
        type: string
    type: object
  vault.VaultSummaryResponse:
    properties:
      change_seq:
        example: 42
        type: integer
      client_id:
        type: string
      created_at:
        type: string
      id:
        example: 1
        type: integer
      key_scope_id:
        example: 1
        type: integer
      key_state:
        example: ok
        type: string
      key_version:
        example: 1
        type: integer
      member_count:
        example: 6
        type: integer
      meta:
        items:
          format: byte
          type: integer
        type: array
      meta_nonce:
        items:
          format: byte
          type: integer
        type: array
      note_count:
        example: 213
        type: integer
      owner_id:
        example: 1
        type: integer
      role:
        example: owner
        type: string
      updated_at:
        type: string
    type: object
  vault.VaultsResponse:
    properties:
      vaults:
        items:
          $ref: '#/definitions/vault.VaultSummaryResponse'
        type: array
    type: object
  vault.bulkFilesRequest:
    properties:
      ids:
        items:
          type: integer
        maxItems: 200
        minItems: 1
        type: array
    required:
    - ids
    type: object
  vault.createFileRequest:
    properties:
      client_id:
        type: string
      content:
        items:
          format: byte
          type: integer
        maxItems: 4194304
        minItems: 16
        type: array
      content_nonce:
        items:
          format: byte
          type: integer
        maxItems: 32
        minItems: 12
        type: array
      folder_id:
        minimum: 1
        type: integer
      key_scope_id:
        minimum: 1
        type: integer
      key_version:
        minimum: 1
        type: integer
      meta:
        items:
          format: byte
          type: integer
        maxItems: 8192
        minItems: 16
        type: array
      meta_nonce:
        items:
          format: byte
          type: integer
        maxItems: 32
        minItems: 12
        type: array
    required:
    - client_id
    - content
    - content_nonce
    - key_scope_id
    - key_version
    - meta
    - meta_nonce
    type: object
  vault.createFolderRequest:
    properties:
      client_id:
        type: string
      key_scope_id:
        description: |-
          KeyScopeID and KeyVersion declare which key the blobs were sealed under. The server
          refuses them when they do not match the destination, because the row would be
          unreadable to everyone who can see it.
        minimum: 1
        type: integer
      key_version:
        minimum: 1
        type: integer
      meta:
        items:
          format: byte
          type: integer
        maxItems: 8192
        minItems: 16
        type: array
      meta_nonce:
        items:
          format: byte
          type: integer
        maxItems: 32
        minItems: 12
        type: array
      parent_id:
        minimum: 1
        type: integer
      position:
        minimum: 0
        type: integer
    required:
    - client_id
    - key_scope_id
    - key_version
    - meta
    - meta_nonce
    type: object
  vault.createVaultRequest:
    properties:
      client_id:
        description: |-
          ClientID is chosen before the row exists, so the metadata can be sealed against a
          stable identity in one round trip.
        type: string
      key_nonce:
        items:
          format: byte
          type: integer
        maxItems: 32
        minItems: 12
        type: array
      meta:
        items:
          format: byte
          type: integer
        maxItems: 8192
        minItems: 16
        type: array
      meta_nonce:
        items:
          format: byte
          type: integer
        maxItems: 32
        minItems: 12
        type: array
      scope_client_id:
        description: ScopeClientID names the vault's own key scope, which the key
          below is sealed against.
        type: string
      wrap_algorithm:
        description: Algorithm names the sealed-box format, so a later format can
          be told apart.
        maxLength: 64
        type: string
      wrapped_key:
        description: WrappedKey is the vault content key sealed to the creator's own
          public key.
        items:
          format: byte
          type: integer
        maxItems: 1024
        minItems: 32
        type: array
    required:
    - client_id
    - key_nonce
    - meta
    - meta_nonce
    - scope_client_id
    - wrapped_key
    type: object
  vault.moveRequest:
    properties:
      parent_id:
        minimum: 1
        type: integer
      position:
        minimum: 0
        type: integer
    type: object
  vault.updateContentRequest:
    properties:
      content:
        items:
          format: byte
          type: integer
        maxItems: 4194304
        minItems: 16
        type: array
      content_nonce:
        items:
          format: byte
          type: integer
        maxItems: 32
        minItems: 12
        type: array
    required:
    - content
    - content_nonce
    type: object
  vault.updateMetaRequest:
    properties:
      meta:
        items:
          format: byte
          type: integer
        maxItems: 8192
        minItems: 16
        type: array
      meta_nonce:
        items:
          format: byte
          type: integer
        maxItems: 32
        minItems: 12
        type: array
      position:
        minimum: 0
        type: integer
    required:
    - meta
    - meta_nonce
    type: object
host: localhost:8080
info:
  contact:
    email: dmitr.murygin@gmail.com
    name: Shelf Backend
  description: REST API of the Shelf service.
  license:
    name: Proprietary
  title: Shelf API
  version: "1.0"
paths:
  /api/v1/auth/keys:
    get:
      description: 'Returns the wrapped keys: the client needs them after a restart
        while the access token is still alive.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.KeysResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Cryptographic material of the user
      tags:
      - auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Verifies auth_hash and returns the wrapped keys together with a
        token pair.
      parameters:
      - description: Login and auth_hash
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.SessionResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Login
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Revokes the session the refresh token belongs to.
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.refreshRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Logout
      tags:
      - auth
  /api/v1/auth/logout-all:
    post:
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Logout on every device
      tags:
      - auth
  /api/v1/auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Current user
      tags:
      - auth
  /api/v1/auth/password:
    post:
      consumes:
      - application/json
      description: Accepts the master key re-encrypted with the new wrapping key.
        All sessions are revoked and the response carries a new token pair.
      parameters:
      - description: New authentication data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.changePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.TokensResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Password change
      tags:
      - auth
  /api/v1/auth/prelogin:
    post:
      consumes:
      - application/json
      description: |-
        Returns the salt and the KDF parameters the client needs to compute auth_hash.
        For an unknown login it returns plausible values so the endpoint does not reveal whether the account exists.
      parameters:
      - description: Login
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.preloginRequest'
      produces:

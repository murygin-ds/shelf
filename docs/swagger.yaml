          $ref: '#/definitions/vault.rekeyItemRequest'
        maxItems: 200
        minItems: 1
        type: array
    required:
    - items
    type: object
  vault.startRekeyRequest:
    properties:
      new_scope_client_id:
        description: |-
          NewScopeClientID names the scope the new key belongs to. It is required when the job
          creates a scope, because the sealed keys have to name it before the row exists.
        type: string
      scope_ref_id:
        minimum: 1
        type: integer
      scope_type:
        enum:
        - vault
        - folder
        - file
        type: string
    required:
    - scope_ref_id
    - scope_type
    type: object
  vault.updateContentRequest:
    properties:
      content:
        items:
          format: byte
          type: integer
        maxItems: 4194304
        minItems: 16
        type: array
      content_nonce:
        items:
          format: byte
          type: integer
        maxItems: 32
        minItems: 12
        type: array
      crdt_epoch:
        description: |-
          The live document this body was folded from, present only when the write comes from
          a live editing session. Absent means the body moved without the document knowing, so
          the document is invalidated and the next session re-seeds from what was just
          written. A client that knows nothing about live editing therefore behaves exactly as
          it did before, which is the point of these being optional.
        minimum: 1
        type: integer
      crdt_snapshot:
        items:
          format: byte
          type: integer
        maxItems: 8388608
        type: array
      crdt_snapshot_nonce:
        items:
          format: byte
          type: integer
        maxItems: 32
        minItems: 12
        type: array
      crdt_upto_seq:
        minimum: 0
        type: integer
      key_scope_id:
        description: |-
          The scope and version the body was sealed under. content_seq alone does not cover
          them: a re-key rewrites the row without touching that sequence, so a write held up
          across a rotation would otherwise land ciphertext under a key nobody holds and the
          row would claim the new version.
        minimum: 1
        type: integer
      key_version:
        minimum: 1
        type: integer
      signature:
        description: |-
          Signature is the author's raw ECDSA P-256 signature over this exact ciphertext in
          this exact slot. Optional so an older client still writes, but a body without one is
          stored as unsigned and the history says so rather than implying authorship.
        items:
          format: byte
          type: integer
        type: array
    required:
    - content
    - content_nonce
    - key_scope_id
    - key_version
    type: object
  vault.updateMetaRequest:
    properties:
      meta:
        items:
          format: byte
          type: integer
        maxItems: 8192
        minItems: 16
        type: array
      meta_nonce:
        items:
          format: byte
          type: integer
        maxItems: 32
        minItems: 12
        type: array
      position:
        minimum: 0
        type: integer
    required:
    - meta
    - meta_nonce
    type: object
host: localhost:8080
info:
  contact:
    email: dmitr.murygin@gmail.com
    name: Shelf Backend
  description: REST API of the Shelf service.
  license:
    name: Proprietary
  title: Shelf API
  version: "1.0"
paths:
  /api/v1/auth/keys:
    get:
      description: 'Returns the wrapped keys: the client needs them after a restart
        while the access token is still alive.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.KeysResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Cryptographic material of the user
      tags:
      - auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Verifies auth_hash and returns the wrapped keys together with a
        token pair.
      parameters:
      - description: Login and auth_hash
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.SessionResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Login
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Revokes the session the refresh token belongs to.
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.refreshRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Logout
      tags:
      - auth
  /api/v1/auth/logout-all:
    post:
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:

      key_scope_id:
        minimum: 1
        type: integer
      key_version:
        minimum: 1
        type: integer
      meta:
        items:
          format: byte
          type: integer
        maxItems: 8192
        minItems: 16
        type: array
      meta_nonce:
        items:
          format: byte
          type: integer
        maxItems: 32
        minItems: 12
        type: array
    required:
    - client_id
    - content
    - content_nonce
    - key_scope_id
    - key_version
    - meta
    - meta_nonce
    type: object
  vault.createFolderRequest:
    properties:
      client_id:
        type: string
      key_scope_id:
        description: |-
          KeyScopeID and KeyVersion declare which key the blobs were sealed under. The server
          refuses them when they do not match the destination, because the row would be
          unreadable to everyone who can see it.
        minimum: 1
        type: integer
      key_version:
        minimum: 1
        type: integer
      meta:
        items:
          format: byte
          type: integer
        maxItems: 8192
        minItems: 16
        type: array
      meta_nonce:
        items:
          format: byte
          type: integer
        maxItems: 32
        minItems: 12
        type: array
      parent_id:
        minimum: 1
        type: integer
      position:
        minimum: 0
        type: integer
    required:
    - client_id
    - key_scope_id
    - key_version
    - meta
    - meta_nonce
    type: object
  vault.createVaultRequest:
    properties:
      client_id:
        description: |-
          ClientID is chosen before the row exists, so the metadata can be sealed against a
          stable identity in one round trip.
        type: string
      key_nonce:
        items:
          format: byte
          type: integer
        maxItems: 32
        minItems: 12
        type: array
      meta:
        items:
          format: byte
          type: integer
        maxItems: 8192
        minItems: 16
        type: array
      meta_nonce:
        items:
          format: byte
          type: integer
        maxItems: 32
        minItems: 12
        type: array
      scope_client_id:
        description: ScopeClientID names the vault's own key scope, which the key
          below is sealed against.
        type: string
      wrap_algorithm:
        description: Algorithm names the sealed-box format, so a later format can
          be told apart.
        maxLength: 64
        type: string
      wrapped_key:
        description: WrappedKey is the vault content key sealed to the creator's own
          public key.
        items:
          format: byte
          type: integer
        maxItems: 1024
        minItems: 32
        type: array
    required:
    - client_id
    - key_nonce
    - meta
    - meta_nonce
    - scope_client_id
    - wrapped_key
    type: object
  vault.moveRequest:
    properties:
      parent_id:
        minimum: 1
        type: integer
      position:
        minimum: 0
        type: integer
    type: object
  vault.updateContentRequest:
    properties:
      content:
        items:
          format: byte
          type: integer
        maxItems: 4194304
        minItems: 16
        type: array
      content_nonce:
        items:
          format: byte
          type: integer
        maxItems: 32
        minItems: 12
        type: array
    required:
    - content
    - content_nonce
    type: object
  vault.updateMetaRequest:
    properties:
      meta:
        items:
          format: byte
          type: integer
        maxItems: 8192
        minItems: 16
        type: array
      meta_nonce:
        items:
          format: byte
          type: integer
        maxItems: 32
        minItems: 12
        type: array
      position:
        minimum: 0
        type: integer
    required:
    - meta
    - meta_nonce
    type: object
host: localhost:8080
info:
  contact:
    email: dmitr.murygin@gmail.com
    name: Shelf Backend
  description: REST API of the Shelf service.
  license:
    name: Proprietary
  title: Shelf API
  version: "1.0"
paths:
  /api/v1/auth/keys:
    get:
      description: 'Returns the wrapped keys: the client needs them after a restart
        while the access token is still alive.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.KeysResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Cryptographic material of the user
      tags:
      - auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Verifies auth_hash and returns the wrapped keys together with a
        token pair.
      parameters:
      - description: Login and auth_hash
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.SessionResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Login
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Revokes the session the refresh token belongs to.
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.refreshRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Logout
      tags:
      - auth
  /api/v1/auth/logout-all:
    post:
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Logout on every device
      tags:
      - auth
  /api/v1/auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Current user
      tags:
      - auth
  /api/v1/auth/password:
    post:
      consumes:
      - application/json
      description: Accepts the master key re-encrypted with the new wrapping key.
        All sessions are revoked and the response carries a new token pair.
      parameters:
      - description: New authentication data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.changePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.TokensResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Password change
      tags:
      - auth
  /api/v1/auth/prelogin:
    post:
      consumes:
      - application/json
      description: |-
        Returns the salt and the KDF parameters the client needs to compute auth_hash.
        For an unknown login it returns plausible values so the endpoint does not reveal whether the account exists.
      parameters:
      - description: Login
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.preloginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.PreloginResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Key derivation parameters
      tags:
      - auth
  /api/v1/auth/recovery/complete:
    post:
      consumes:
      - application/json
      description: Sets the new authentication data using the token issued by recovery/start.
      parameters:
      - description: New authentication data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.recoveryCompleteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.TokensResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Access recovery completion
      tags:
      - auth
  /api/v1/auth/recovery/start:
    post:
      consumes:
      - application/json
      description: |-
        Verifies ownership of the recovery code and returns the master key wrapped with it
        together with a short-lived token for completing the recovery.
      parameters:
      - description: Login and recovery code verifier
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.recoveryStartRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.RecoveryChallengeResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Access recovery start
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: 'Exchanges a refresh token for a new pair. The token is single-use:
        presenting it again revokes all sessions.'
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.refreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.TokensResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Token pair refresh
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: |-
        Creates an account from the cryptographic material prepared by the client and opens a session.
        The server never sees the password: the client derives the master key wrapping key and auth_hash from it.
      parameters:
      - description: Registration data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.SessionResponse'
        "409":
          description: Login is already taken
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Registration
      tags:
      - auth
  /api/v1/auth/sessions:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.DevicesResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Active sessions
      tags:
      - auth
  /api/v1/auth/sessions/{id}:
    delete:
      parameters:
      - description: Session identifier
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Session revocation
      tags:
      - auth
  /api/v1/files/{id}:
    delete:
      parameters:
      - description: file id
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Trash a note
      tags:
      - files
    get:
      parameters:
      - description: file id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/vault.FileResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Read a note
      tags:
      - files
    patch:
      consumes:
      - application/json
      parameters:
      - description: file id
        in: path
        name: id
        required: true
        type: integer
      - description: encrypted note metadata
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/vault.updateMetaRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/vault.FileResponse'
      security:
      - BearerAuth: []
      summary: Update note metadata
      tags:
      - files
  /api/v1/files/{id}/content:
    put:
      consumes:
      - application/json
      parameters:
      - description: file id
        in: path
        name: id
        required: true
        type: integer
      - description: content sequence the client last saw
        in: header
        name: If-Match
        required: true
        type: integer
      - description: encrypted body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/vault.updateContentRequest'
      produces:

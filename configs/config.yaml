# Base service configuration.
# Any value is overridden by an environment variable: http.read_timeout -> SHELF_HTTP_READ_TIMEOUT.
# Secrets do not belong here — keep them in .env / environment variables.

app:
  name: shelf-backend
  env: local # local | dev | stage | prod

http:
  host: 0.0.0.0
  port: 8080
  read_timeout: 10s
  write_timeout: 10s
  handler_timeout: 8s # bounds the work behind a request, not only the socket
  idle_timeout: 60s
  shutdown_timeout: 10s
  # The binary serves the frontend itself and the dev server proxies /api, so both are
  # same-origin and CORS is not needed at all. Fill this in only for a separate front end.
  allowed_origins: [ ]
  trusted_proxies: [ ] # for example: ["10.0.0.0/8"] behind nginx/ingress
  swagger_enabled: false # the API surface is published to anyone who can reach the port
  max_body_bytes: 8388608 # 8 MiB, the ceiling for the batch endpoints
  static_cache_max_age: 8760h # hashed frontend assets never change under the same name

postgres:
  host: localhost
  port: 5432
  user: postgres
  password: "" # SHELF_POSTGRES_PASSWORD
  database: shelf
  ssl_mode: prefer # require or verify-full when Postgres is not on this host
  max_conns: 10
  min_conns: 2
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m
  connect_timeout: 5s

auth:
  secret: "" # SHELF_AUTH_SECRET, at least 32 characters; required everywhere except local
  issuer: shelf
  access_ttl: 15m
  refresh_ttl: 720h
  recovery_ttl: 10m # window between the recovery code check and the password change
  # server-side Argon2id on top of the auth_hash sent by the client
  argon2:
    memory: 65536 # KiB
    iterations: 3
    parallelism: 2
    salt_length: 16
    key_length: 32
  # limits password and recovery code guessing; a successful request does not spend an attempt
  rate_limit:
    enabled: true
    login_ip: { limit: 10, window: 5m }
    login_account: { limit: 20, window: 15m }
    recovery_ip: { limit: 5, window: 15m }
    recovery_account: { limit: 10, window: 1h }
    # a resolved invite refunds its attempt, so only failed guesses spend the counter
    invite_ip: { limit: 20, window: 15m }
    share_ip: { limit: 60, window: 15m }
    register_ip: { limit: 20, window: 1h }

log:
  level: debug # debug | info | warn | error
  format: console # console | json
